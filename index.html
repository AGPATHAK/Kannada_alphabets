  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<style>/* ============================================================\n   Typography tokens — Cormorant Garamond (display) + Jost (body)\n   1.25 ratio scale, 18px base for 60+ eyes. Generous line height.\n   ============================================================ */\n\n:root {\n  --font-display:    'Cormorant Garamond', Georgia, serif;\n  --font-body:       'Jost', 'Helvetica Neue', sans-serif;\n  --font-kannada:    'Noto Serif Kannada', serif;\n  --font-devanagari: 'Noto Sans Devanagari', sans-serif;\n\n  /* Type scale */\n  --text-sm:    0.833rem;  /* 15px  captions, annotations, labels */\n  --text-base:  1.125rem;  /* 18px  body */\n  --text-lg:    1.406rem;  /* 22.5px  card titles */\n  --text-xl:    1.758rem;  /* 28px  section headings */\n  --text-2xl:   2.197rem;  /* 35px  page titles */\n  --text-glyph: 3.5rem;    /* 56px  primary Kannada practice glyphs */\n\n  --leading-body:  1.65;\n  --leading-tight: 1.25;\n\n  --weight-light:  300;\n  --weight-normal: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n\n  --tracking-label: 0.06em;\n\n  /* Semantic aliases */\n  --text-heading-font:   var(--font-display);\n  --text-heading-weight: var(--weight-semibold);\n  --text-body-font:      var(--font-body);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Spacing, layout, radius, shadow, motion tokens — 8px base.\n   ============================================================ */\n\n:root {\n  --space-1: 0.5rem;   /* 8px */\n  --space-2: 1rem;     /* 16px */\n  --space-3: 1.5rem;   /* 24px */\n  --space-4: 2rem;     /* 32px */\n  --space-6: 3rem;     /* 48px */\n  --space-8: 4rem;     /* 64px */\n\n  /* Layout */\n  --measure: 720px;    /* max reading width */\n  --gallery-min: 200px; /* card grid min column */\n\n  /* Radius — one radius everywhere */\n  --radius: 8px;\n\n  /* Borders */\n  --border-width: 1px;\n  --border-default: 1px solid var(--mist);\n\n  /* Shadow — soft, used instead of a border, ---- */\n  --correct:      #5E7A5E;\n  --correct-soft: #E7EDE7;\n  --incorrect:    #9C5A52;\n  --incorrect-soft: #F3E7E5;\n\n  /* ---- Semantic aliases ---- */\n  --surface-page:      var(--paper);\n  --surface-card:      var(--fog);\n  --surface-card-alt:  #FFFFFF;\n  --border-default:    var(--mist);\n  --text-primary:      var(--ink);\n  --text-secondary:    var(--stone);\n  --text-tertiary:     var(--whisper);\n  --text-on-accent:    #FFFFFF;\n}\n\n/* ============================================================\n   Typography tokens — Cormorant Garamond (display) + Jost (body)\n   1.25 ratio scale, 18px base for 60+ eyes. Generous line height.\n   ============================================================ */\n\n:root {\n  --font-display:    'Cormorant Garamond', Georgia, serif;\n  --font-body:       'Jost', 'Helvetica Neue', sans-serif;\n  --font-kannada:    'Noto Serif Kannada', serif;\n  --font-devanagari: 'Noto Sans Devanagari', sans-serif;\n\n  /* Type scale */\n  --text-sm:    0.833rem;  /* 15px  captions, annotations, labels */\n  --text-base:  1.125rem;  /* 18px  body */\n  --text-lg:    1.406rem;  /* 22.5px  card titles */\n  --text-xl:    1.758rem;  /* 28px  section headings */\n  --text-2xl:   2.197rem;  /* 35px  page titles */\n  --text-glyph: 3.5rem;    /* 56px  primary Kannada practice glyphs */\n\n  --leading-body:  1.65;\n  --leading-tight: 1.25;\n\n  --weight-light:  300;\n  --weight-normal: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n\n  --tracking-label: 0.06em;\n\n  /* Semantic aliases */\n  --text-heading-font:   var(--font-display);\n  --text-heading-weight: var(--weight-semibold);\n  --text-body-font:      var(--font-body);\n}\n\n/* ============================================================\n   Spacing, layout, radius, shadow, motion tokens — 8px base.\n   ============================================================ */\n\n:root {\n  --space-1: 0.5rem;   /* 8px */\n  --space-2: 1rem;     /* 16px */\n  --space-3: 1.5rem;   /* 24px */\n  --space-4: 2rem;     /* 32px */\n  --space-6: 3rem;     /* 48px */\n  --space-8: 4rem;     /* 64px */\n\n  /* Layout */\n  --measure: 720px;    /* max reading width */\n  --gallery-min: 200px; /* card grid min column */\n\n  /* Radius — one radius everywhere */\n  --radius: 8px;\n\n  /* Borders */\n  --border-width: 1px;\n  --border-default: 1px solid var(--mist);\n\n  /* Shadow — soft, used instead of a border, never both */\n  --shadow-soft: 0 1px 3px rgba(44, 46, 49, 0.07);\n\n  /* Touch */\n  --touch-target: 44px;\n\n  /* Motion — quiet, meaningful only */\n  --transition: 160ms ease; /* @kind other */\n  --transition-slow: 280ms ease; /* @kind other */\n}\n\n@media (prefers-reduced-motion: reduce) {\n  * { transition: none !important; animation: none !important; }\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  background: var(--surface-page);\n  color: var(--text-primary);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-body);\n  margin: 0;\n}\n\nh1, h2, h3 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  line-height: var(--leading-tight);\n  margin: 0;\n}\n\n<\u002Fstyle>\n  <script src=\"a03d4dcf-acb1-4f0e-b8ae-ae2bf155e650\"><\u002Fscript>\n  <style>\n    body { background: var(--paper); }\n    @keyframes blink-wrong { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width: var(--measure); margin: 0 auto; padding: var(--space-4) var(--space-3) var(--space-8); min-height: 100vh;\">\n\n  <header style=\"display: flex; align-items: baseline; gap: var(--space-2); margin-bottom: var(--space-4);\">\n    <h1 style=\"font-family: var(--font-display); font-size: var(--text-2xl); color: var(--text-primary);\">Kannada Alphabet Trainer<\u002Fh1>\n    <span style=\"margin-left: auto; font-family: var(--font-body); font-size: var(--text-sm); color: var(--text-tertiary); text-transform: uppercase; letter-s om: var(--space-2);\">Letters to work on<\u002Fh3>\n          <sc-if value=\"{{ hasWeakLetters }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: var(--space-1);\">\n              <sc-for list=\"{{ weakLetters }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; background: var(--fog); border-radius: var(--radius); padding: var(--space-2) var(--space-3);\">\n                  <div style=\"font-family: var(--font-kannada); font-size: var(--text-xl); font-weight: var(--weight-semibold); color: var(--text-primary);\">{{ l.kn }}<\u002Fdiv>\n                  <div style=\"font-family: var(--font-body); font-size: var(--text-sm); color: var(--text-secondary);\">{{ l.attempts }} attempts<\u002Fdiv>\n                  <div style=\"font-family: var(--font-body); font-weight: var(--weight-medium); color: var(--incorrect);\">{{ l.acc }}%<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noWeakLetters }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-family: var(--font-body); font-size: var(--text-sm); color: var(--text-tertiary);\">No weak letters yet — keep practicing.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <x-import component-from-global-scope=\"ArdhenduDesignLanguage_fdd3b0.Button\" hint-size=\"100%,44px\" variant=\"ghost\" on-click=\"{{ resetLetterStats }}\" style=\"display: flex; flex-direction: column; width: 100%; color: var(--incorrect);\">\n          Reset letter accuracy data\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"ArdhenduDesignLanguage_fdd3b0.Button\" hint-size=\"100%,44px\" variant=\"primary\" on-click=\"{{ goHome }}\" style=\"display: flex; flex-direction: column; width: 100%;\">\n          Back to home\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fx-import>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst LETTERS = [\n{kn:\"ಅ\",dev:\"अ\",group:\"vowel\"},\n{kn:\"ಆ\",dev:\"आ\",group:\"vowel\"},\n{kn:\"ಇ\",dev:\"इ\",group:\"vowel\"},\n{kn:\"ಈ\",dev:\"ई\",group:\"vowel\"},\n{kn:\"ಉ\",dev:\"उ\",group:\"vowel\"},\n{kn:\"ಊ\",dev:\"ऊ\",group:\"vowel\"},\n{kn:\"ಎ\",dev:\"ए (ह्रस्व)\",group:\"vowel\"},\n{kn:\"ಏ\",dev:\"ए (दीर्घ)\",group:\"vowel\"},\n{kn:\"ಐ\",dev:\"ऐ\",group:\"vowel\"},\n{kn:\"ಒ\",dev:\"ओ (ह्रस्व)\",group:\"vowel\"},\n{kn:\"ಓ\",dev:\"ओ (दीर्घ)\",group:\"vowel\"},\n{kn:\"ಔ\",dev:\"औ\",group:\"vowel\"},\n{kn:\"ಅಂ\",dev:\"अं\",group:\"vowel\"},\n{kn:\"ಅಃ\",dev:\"अः\",group:\"vowel\"},\n{kn:\"ಋ\",dev:\"ऋ\",group:\"vowel\"},\n{kn:\"ಕ\",dev:\"क\",group:\"velar\"},\n{kn:\"ಖ\",dev:\"ख\",group:\"velar\"},\n{kn:\"ಗ\",dev:\"ग\",group:\"velar\"},\n{kn:\"ಘ\",dev:\"घ\",group:\"velar\"},\n{kn:\"ಚ\",dev:\"च\",group:\"palatal\"},\n{kn:\"ಛ\",dev:\"छ\",group:\"palatal\"},\n{kn:\"ಜ\",dev:\"ज\",group:\"palatal\"},\n{kn:\"ಝ\",dev:\"झ\",group:\"palatal\"},\n{kn:\"ಟ\",dev:\"ट\",group:\"retroflex\"},\n{kn:\"ಠ\",dev:\"ठ\",group:\"retroflex\"},\n{kn:\"ಡ\",dev:\"ड\",group:\"retroflex\"},\n{kn:\"ಢ\",dev:\"ढ\",group:\"retroflex\"},\n{kn:\"ತ\",dev:\"त\",group:\"dental\"},\n{kn:\"ಥ\",dev:\"थ\",group:\"dental\"},\n{kn:\"ದ\",dev:\"द\",group:\"dental\"},\n{kn:\"ಧ\",dev:\"ध\",group:\"dental\"},\n{kn:\"ಪ\",dev:\"प\",group:\"labial\"},\n{kn:\"ಫ\",dev:\"फ\",group:\"labial\"},\n{kn:\"ಬ\",dev:\"ब\",group:\"labial\"},\n{kn:\"ಭ\",dev:\"भ\",group:\"labial\"},\n{kn:\"ಮ\",dev:\"म\",group:\"nasal\"},\n{kn:\"ನ\",dev:\"न\",group:\"nasal\"},\n{kn:\"ಣ\",dev:\"ण\",group:\"nasal\"},\n{kn:\"ಲ\",dev:\"ल\",group:\"liquid\"},\n{kn:\"ರ\",dev:\"र\",group:\"liquid\"},\n{kn:\"ಯ\",dev:\"य\",group:\"semi\"},\n{kn:\"ವ\",dev:\"व\",group:\"semi\"},\n{kn:\"ಶ\",dev:\"श\",group:\"sibilant\"},\n{kn:\"ಷ\",dev:\"ष\",group:\"sibilant\"},\n{kn:\"ಸ\",dev:\"स\",group:\"sibilant\"},\n{kn:\"ಹ\",dev:\"ह\",group:\"aspirate\"},\n{kn:\"ಳ\",dev:\"ळ\",group:\"liquid\"},\n{kn:\"ಕ್ಷ\",dev:\"क्ष\",group:\"consonant\"},\n{kn:\"ಜ್ಞ\",dev:\"ज्ञ\",group:\"consonant\"}\n];\n\nconst STORAGE_KEY = \"kannada_alphabet_progress_v1\";\nconst WEAK_THRESHOLD = 0.99;\nconst WEAK_MIN_ATTEMPTS = 8;\n\nfunction loadProgress() {\n  try {\n    const data = localStorage.getItem(STORAGE_KEY);\n    if (!data) throw new Error('none');\n    return JSON.parse(data);\n  } catch (e) {\n    return { sessions: [], totalSessions: 0, totalCorrect: 0, totalAttempts: 0, currentStreak: 0, bestStreak: 0, letterStats: {} };\n  }\n}\n\nfunction shuffle(arr) {\n  return [...arr].sort(() => Math.random() - 0.5);\n}\n\nfunction formatSessionDate(iso) {\n  const d = new Date(iso);\n  const now = new Date();\n  const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));\n  if (diffDays === 0) return \"Today\";\n  if (diffDays === 1) return \"Yesterday\";\n  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });\n}\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'home',\n    progress: loadProgress(),\n    practiceMode: 'normal',\n    subset: 'all',\n    cardCount: '10',\n    timerVal: '5',\n    session: null,\n    mistakes: [],\n    timeLeft: null,\n    selected: null,\n    correctValue: null,\n    wrongBlink: false,\n  };\n\n  componentDidMount() {\n    this._timerHandle = null;\n    this._blinkHandle = null;\n    this._advanceHandle = null;\n    this._keyHandler = (e) => {\n      if (this.state.screen !== 'play' || this.state.selected) return;\n      const key = e.key;\n      if (key >= '1' && key <= '4') {\n        const idx = parseInt(key) - 1;\n        const opts = this._currentOptions || [];\n        if (opts[idx]) this.selectOption(opts[idx]);\n      }\n    };\n    window.addEventListener('keydown', this._keyHandler);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._timerHandle);\n    clearInterval(this._blinkHandle);\n    clearTimeout(this._advanceHandle);\n    window.removeEventListener('keydown', this._keyHandler);\n  }\n\n  saveProgress() {\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state.progress));\n  }\n\n  getWeakCards(basePool) {\n    const stats = this.state.progress.letterStats || {};\n    return basePool.filter((l) => {\n      const s = stats[l.kn];\n      const attempts = s ? (s.attempts || 0) : 0;\n      const correct = s ? (s.correct || 0) : 0;\n      if (attempts < WEAK_MIN_ATTEMPTS) return false;\n      const acc = attempts > 0 ? correct / attempts : 0;\n      return acc < WEAK_THRESHOLD;\n    });\n  }\n\n  goHome = () => {\n    clearInterval(this._timerHandle);\n    clearInterval(this._blinkHandle);\n    clearTimeout(this._advanceHandle);\n    this.setState({ screen: 'home', session: null });\n  };\n\n  goStats = () => this.setState({ screen: 'stats' });\n\n  startNormal = () => this.setState({ practiceMode: 'normal', screen: 'settings' });\n  startWeak = () => this.setState({ practiceMode: 'weak', screen: 'settings' });\n\n  setSubsetAll = () => this.setState({ subset: 'all' });\n  setSubsetVowel = () => this.setState({ subset: 'vowel' });\n  setSubsetConsonant = () => this.setState({ subset: 'consonant' });\n  setCardCount = (e) => this.setState({ cardCount: e.target.value });\n  setTimer = (e) => this.setState({ timerVal: e.target.value });\n\n  beginSession = () => {\n    const { subset, cardCount, timerVal, practiceMode } = this.state;\n    let basePool = LETTERS;\n    if (subset === 'vowel') basePool = basePool.filter((l) => l.group === 'vowel');\n    if (subset === 'consonant') basePool = basePool.filter((l) => l.group !== 'vowel');\n\n    let cardPool = basePool;\n    if (practiceMode === 'weak') {\n      const weak = this.getWeakCards(basePool);\n      if (weak.length === 0) {\n        alert('No weak letters found yet (needs a bit more history). Try a normal session first.');\n        return;\n      }\n      cardPool = weak;\n    }\n\n    let cards;\n    if (cardCount === 'full') cards = shuffle(cardPool);\n    else cards = shuffle(cardPool).slice(0, Number(cardCount));\n\n    const session = {\n      cards,\n      timer: Number(timerVal),\n      index: 0,\n      score: 0,\n      mode: practiceMode,\n      pool: basePool,\n    };\n\n    this.setState({ session, mistakes: [], screen: 'play', selected: null, correctValue: null }, () => {\n      this.runTimer();\n    });\n  };\n\n  buildOptions(card, pool) {\n    const others = shuffle(pool.filter((l) => l.kn !== card.kn));\n    const selected = [card, ...others.slice(0, 3)];\n    return shuffle(selected).map((x) => x.dev);\n  }\n\n  runTimer() {\n    clearInterval(this._timerHandle);\n    const session = this.state.session;\n    if (!session || !session.timer) {\n      this.setState({ timeLeft: null });\n      return;\n    }\n    let t = session.timer;\n    this.setState({ timeLeft: t });\n    this._timerHandle = setInterval(() => {\n      t--;\n      this.setState({ timeLeft: t });\n      if (t <= 0) {\n        clearInterval(this._timerHandle);\n        this.timeExpired();\n      }\n    }, 1200);\n  }\n\n  timeExpired() {\n    const session = this.state.session;\n    const card = session.cards[session.index];\n    const mistakes = [...this.state.mistakes, card];\n    const nextIndex = session.index + 1;\n    this.setState({ mistakes, session: { ...session, index: nextIndex }, selected: null, correctValue: null }, () => {\n      this.advance();\n    });\n  }\n\n  selectOption = (value) => {\n    if (this.state.selected) return;\n    clearInterval(this._timerHandle);\n    const session = this.state.session;\n    const card = session.cards[session.index];\n    const correct = card.dev;\n    const isCorrect = value === correct;\n\n    const progress = { ...this.state.progress };\n    if (!progress.letterStats[card.kn]) progress.letterStats[card.kn] = { attempts: 0, correct: 0 };\n    progress.letterStats[card.kn] = {\n      attempts: progress.letterStats[card.kn].attempts + 1,\n      correct: progress.letterStats[card.kn].correct + (isCorrect ? 1 : 0),\n    };\n\n    const mistakes = isCorrect ? this.state.mistakes : [...this.state.mistakes, card];\n    const newSession = { ...session, score: session.score + (isCorrect ? 1 : 0) };\n\n    this.setState({ selected: value, correctValue: correct, progress, mistakes, session: newSession, wrongBlink: !isCorrect });\n\n    if (!isCorrect) {\n      let blinks = 0;\n      this._blinkHandle = setInterval(() => {\n        blinks++;\n        this.setState((s) => ({ wrongBlink: !s.wrongBlink }));\n        if (blinks >= 6) {\n          clearInterval(this._blinkHandle);\n          this.setState({ wrongBlink: true });\n        }\n      }, 120);\n    }\n\n    this._advanceHandle = setTimeout(() => {\n      const s2 = { ...this.state.session, index: this.state.session.index + 1 };\n      this.setState({ session: s2, selected: null, correctValue: null }, () => this.advance());\n    }, 1400);\n  };\n\n  advance() {\n    const session = this.state.session;\n    if (session.index >= session.cards.length) {\n      this.endSession();\n    } else {\n      this.runTimer();\n    }\n  }\n\n  endSession() {\n    const session = this.state.session;\n    const total = session.cards.length;\n    const accuracy = total > 0 ? Math.round((session.score / total) * 100) : 0;\n    const progress = { ...this.state.progress };\n    progress.totalSessions++;\n    progress.totalCorrect += session.score;\n    progress.totalAttempts += total;\n    if (accuracy === 100) {\n      progress.currentStreak++;\n      if (progress.currentStreak > progress.bestStreak) progress.bestStreak = progress.currentStreak;\n    } else {\n      progress.currentStreak = 0;\n    }\n    progress.sessions = [{ date: new Date().toISOString(), accuracy, total, score: session.score }, ...progress.sessions];\n    if (progress.sessions.length > 20) progress.sessions = progress.sessions.slice(0, 20);\n\n    this.setState({ progress, screen: 'end' }, () => this.saveProgress());\n  }\n\n  retryMistakes = () => {\n    const cards = [...this.state.mistakes];\n    const session = { ...this.state.session, cards, index: 0, score: 0 };\n    this.setState({ session, mistakes: [], screen: 'play', selected: null, correctValue: null }, () => this.runTimer());\n  };\n\n  resetLetterStats = () => {\n    if (confirm('Reset all letter accuracy data? Session history will be kept.')) {\n      const progress = { ...this.state.progress, letterStats: {} };\n      this.setState({ progress }, () => this.saveProgress());\n    }\n  };\n\n  renderVals() {\n    const { screen, progress, session, mistakes, subset, cardCount, timerVal, timeLeft, selected, correctValue, wrongBlink, practiceMode } = this.state;\n\n    const avg = progress.totalAttempts > 0 ? Math.round((progress.totalCorrect / progress.totalAttempts) * 100) : 0;\n    const statsVals = {\n      totalSessions: progress.totalSessions,\n      avgAccuracy: avg,\n      currentStreak: progress.currentStreak,\n      bestStreak: progress.bestStreak,\n      lastSessionText: progress.sessions.length > 0 ? `Last session: ${progress.sessions[0].score}/${progress.sessions[0].total}` : '',\n    };\n\n    let promptGlyph = '', progressPct = '0%', optionButtons = [], cardIndexDisplay = '', cardTotalDisplay = '', scoreDisplay = '', timerText = '';\n    if (session) {\n      const idx = Math.min(session.index, session.cards.length - 1);\n      const card = session.cards[idx] || session.cards[session.cards.length - 1];\n      if (session.index < session.cards.length) {\n        promptGlyph = card.kn;\n        if (!this._optionsCache || this._optionsCacheKey !== session.index + '-' + practiceMode) {\n          this._optionsCache = this.buildOptions(card, session.pool);\n          this._optionsCacheKey = session.index + '-' + practiceMode;\n        }\n        this._currentOptions = this._optionsCache;\n        progressPct = Math.round((session.index / session.cards.length) * 100) + '%';\n        cardIndexDisplay = session.index + 1;\n        cardTotalDisplay = session.cards.length;\n        scoreDisplay = session.score;\n        timerText = timeLeft !== null && timeLeft !== undefined ? timeLeft + 's' : '';\n\n        optionButtons = this._currentOptions.map((opt) => {\n          let bg = 'var(--surface-card-alt)', color = 'var(--text-primary)', border = '1px solid var(--mist)', opacity = 1;\n          if (selected) {\n            if (opt === correctValue) {\n              bg = 'var(--correct)'; color = '#fff'; border = '1px solid var(--correct)';\n            } else if (opt === selected) {\n              if (wrongBlink) { bg = 'var(--incorrect)'; color = '#fff'; border = '1px solid var(--incorrect)'; }\n              else { bg = 'var(--surface-card-alt)'; color = 'var(--text-primary)'; border = '1px solid var(--mist)'; }\n            } else {\n              opacity = 0.55;\n            }\n          }\n          return {\n            label: opt,\n            disabled: !!selected,\n            onClick: () => this.selectOption(opt),\n            bg, color, border, opacity,\n          };\n        });\n      } else {\n        this._optionsCache = null;\n      }\n    } else {\n      this._optionsCache = null;\n    }\n\n    const isPerfect = mistakes.length === 0;\n    const scoreText = session ? `${session.score}/${session.cards.length} • ${Math.round((session.score / session.cards.length) * 100)}%` : '';\n    const mistakeItems = mistakes.map((m) => ({ kn: m.kn, dev: m.dev }));\n\n    const recentSessions = progress.sessions.slice(0, 5).map((s) => ({\n      dateLabel: formatSessionDate(s.date),\n      score: s.score,\n      total: s.total,\n      accuracy: s.accuracy,\n      accColor: s.accuracy === 100 ? 'var(--correct)' : 'var(--text-secondary)',\n    }));\n\n    const weakLetters = Object.keys(progress.letterStats || {})\n      .map((l) => ({\n        kn: l,\n        acc: Math.round((progress.letterStats[l].correct / progress.letterStats[l].attempts) * 100),\n        attempts: progress.letterStats[l].attempts,\n      }))\n      .filter((l) => l.acc < 99)\n      .sort((a, b) => a.acc - b.acc)\n      .slice(0, 10);\n\n    return {\n      screen_home: screen === 'home',\n      screen_settings: screen === 'settings',\n      screen_play: screen === 'play',\n      screen_end: screen === 'end',\n      screen_stats: screen === 'stats',\n      stats: statsVals,\n      isWeakMode: practiceMode === 'weak',\n      subsetAll: subset === 'all',\n      subsetVowel: subset === 'vowel',\n      subsetConsonant: subset === 'consonant',\n      cardCount,\n      timerVal,\n      startNormal: this.startNormal,\n      startWeak: this.startWeak,\n      goStats: this.goStats,\n      goHome: this.goHome,\n      setSubsetAll: this.setSubsetAll,\n      setSubsetVowel: this.setSubsetVowel,\n      setSubsetConsonant: this.setSubsetConsonant,\n      setCardCount: this.setCardCount,\n      setTimer: this.setTimer,\n      beginSession: this.beginSession,\n      promptGlyph,\n      progressPct,\n      optionButtons,\n      cardIndexDisplay,\n      cardTotalDisplay,\n      scoreDisplay,\n      timerText,\n      isPerfect,\n      hasMistakes: mistakes.length > 0,\n      scoreText,\n      mistakeItems,\n      retryMistakes: this.retryMistakes,\n      hasRecentSessions: recentSessions.length > 0,\n      noRecentSessions: recentSessions.length === 0,\n      recentSessions,\n      hasWeakLetters: weakLetters.length > 0,\n      noWeakLetters: weakLetters.length === 0,\n      weakLetters,\n      resetLetterStats: this.resetLetterStats,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
